name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # Updated from v6 to v7 [citation:6][citation:11]
      - name: Setup Pages
        uses: actions/configure-pages@v6 # Updated from v5 to v6 [citation:2]
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # Updated from v2 to v5 [citation:3][citation:13]
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # Updated from v2 to v5 [citation:4][citation:14]
